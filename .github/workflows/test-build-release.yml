name: test-build-release

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Update
        run: sudo apt-get update

      - name: Install dependencies
        run: sudo apt-get install -y libudev-dev

      - name: Run format
        run: cargo fmt --check --verbose
  
      - name: Run clippy
        run: cargo clippy --verbose

      - name: Run clippy (heatshrink)
        run: cargo clippy --verbose --features heatshrink

      - name: Run tests
        run: cargo test --verbose

      - name: Run tests (heatshrink)
        run: cargo test --verbose --features heatshrink

  build-x86_64:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Update
        run: sudo apt-get update

      - name: Install dependencies
        run: sudo apt-get install -y libudev-dev

      - name: Add Rust target for each architecture
        run: |
          rustup target add x86_64-unknown-linux-gnu || true
          
      - name: Build
        run: cargo build --verbose --release --features heatshrink --target x86_64-unknown-linux-gnu

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-x86_64
          path: target/x86_64-unknown-linux-gnu/release/xcontroller
          retention-days: 1

  build-aarch64:
    runs-on: ubuntu-22.04-arm
    needs: test
    
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Update
        run: sudo apt-get update

      - name: Install dependencies
        run: sudo apt-get install -y libudev-dev

      - name: Add ARM target for arm64 raspbian
        run: rustup target add aarch64-unknown-linux-gnu || true

      - name: Build
        run: cargo build --verbose --release --features heatshrink --target aarch64-unknown-linux-gnu
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-aarch64
          path: target/aarch64-unknown-linux-gnu/release/xcontroller
          retention-days: 1

  release:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    # Only master publishes releases; develop pushes and PRs stop after build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> $GITHUB_OUTPUT

      # Download build artifacts for each architecture
      - name: Download build artifacts for x86_64
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-x86_64
          path: target/x86_64-unknown-linux-gnu/release

      - name: Download build artifacts for aarch64
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-aarch64
          path: target/aarch64-unknown-linux-gnu/release

      # action-gh-release uploads each file under its on-disk name, and both
      # builds produce a binary called `xcontroller`. Rename them first so the
      # published asset names stay xcontroller-x86_64 / xcontroller-aarch64.
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp target/x86_64-unknown-linux-gnu/release/xcontroller release-assets/xcontroller-x86_64
          cp target/aarch64-unknown-linux-gnu/release/xcontroller release-assets/xcontroller-aarch64
          chmod +x release-assets/*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: release-assets/*
